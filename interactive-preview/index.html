<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}#app{height:100svh;min-height:480px;background:black;position:relative;overflow:hidden}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .65s ease;pointer-events:none;padding:20px}.scene.active{opacity:1;visibility:visible;pointer-events:auto}.cover{object-fit:contain;max-width:100%;max-height:66vh;user-select:none;-webkit-user-drag:none}.image-button{color:#fff;border:0;background:transparent;padding:0;max-width:100%;display:flex;align-items:center;justify-content:center}.image-button img{max-height:76svh;max-width:min(95vw,620px);object-fit:contain}.key3d-wrap{position:relative;width:min(92vw,560px);height:min(60svh,520px)}.key3d{width:100%;height:100%;background:transparent;--poster-color:transparent;cursor:pointer;transition:transform .18s ease}.key3d:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:24px}.key3d.pressed{transform:scale(.94)}.key3d-wrap::before,.key3d-wrap::after{content:"";position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;margin:-21% 0 0 -21%;border-radius:50%;border:1.5px solid rgba(190,215,255,.75);opacity:0;pointer-events:none}.key3d-wrap.ripple::before{animation:keyring .9s ease-out forwards}.key3d-wrap.ripple::after{animation:keyring .9s .18s ease-out forwards}@keyframes keyring{0%{opacity:.85;transform:scale(.6)}100%{opacity:0;transform:scale(2.1)}}.key-hint{margin-top:4px;transition:opacity .3s}.caption{text-align:center;font-size:clamp(21px,4vw,36px);font-weight:300;margin:12px 0 22px}.cta{padding:14px 28px;border:1px solid #ddd;border-radius:50px;background:#121212;color:#fff}.tiny{font-size:11px;letter-spacing:.18em;color:#bbb}.top{position:absolute;top:3%;left:0;right:0;text-align:center;z-index:4;pointer-events:none}.brand{font-size:clamp(25px,5vw,52px);font-stretch:condensed;font-weight:900;letter-spacing:.04em}.bottom{position:absolute;bottom:2%;display:flex;gap:15px;justify-content:center;left:0;right:0;z-index:5}.bottom button{border:none;color:#aaa;background:none;font-size:12px}.bottom button:focus-visible{outline:2px solid #fff}.cards{display:flex;align-items:center;justify-content:center;isolation:isolate;height:min(52vh,420px);width:100%;max-width:650px;position:relative}.card{position:absolute;width:min(48vw,245px);aspect-ratio:1;transition:transform .6s;filter:drop-shadow(0 8px 13px #000);border:0;background:none;padding:0}.card img{width:100%;height:100%;object-fit:contain}.card:nth-child(1){transform:translate(-35%,-10%) rotate(-13deg)}.card:nth-child(2){transform:translate(35%,-9%) rotate(13deg)}.card:nth-child(3){transform:translate(0,17%) scale(1.05);z-index:2}.card:hover{z-index:3;transform:translate(0,-5%) scale(1.12)}.recordbox{position:relative;width:min(84vw,420px);aspect-ratio:1;touch-action:pan-y;user-select:none}.record,.sleeve{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;will-change:transform}.record{width:84%;height:84%;top:8%;left:7%;transform:translateX(calc(var(--pull, 0) * 54%));transition:transform .05s linear;z-index:1}.sleeve{z-index:2;transform:translateX(calc(var(--pull, 0) * -54%));transition:transform .05s linear}.controls{display:flex;gap:12px;align-items:center;justify-content:center;width:min(85vw,450px);margin-top:22px}.controls input{flex:1;accent-color:#eac08e}.form{display:grid;gap:13px;width:min(90vw,470px);padding:28px;border-radius:20px;border:1px solid #777;background:linear-gradient(130deg,#1d1d1d,#030303)}.form input{width:100%;border-radius:12px;background:#141414;color:white;border:1px solid #888;padding:14px}.form button{background:#f2efe7;color:#101010;border:0;border-radius:30px;padding:15px}.note{color:#888;font-size:12px}.hidden{display:none!important}.deck3d{width:min(96vw,680px);height:min(54svh,520px);background:transparent;--poster-color:transparent}.hs{width:46px;height:46px;border-radius:50%;border:2px solid transparent;background:transparent;cursor:pointer;padding:0;position:relative}.hs::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#f0561d;box-shadow:0 0 0 4px rgba(240,86,29,.25)}.hs::after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);white-space:nowrap;font:500 11px/1 ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#18181d;border:1px solid rgba(255,255,255,.18);padding:5px 8px;border-radius:999px}.hs:hover,.hs:focus-visible{border-color:#f0561d;outline:none}.glass-cta{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;width:min(84vw,440px);height:64px;padding:0 34px;border:1.5px solid transparent;border-radius:999px;color:#fff;font-size:17px;letter-spacing:.01em;background:linear-gradient(#08090c,#08090c) padding-box,linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.14) 45%,rgba(255,255,255,.32)) border-box;box-shadow:inset 0 1px 10px rgba(255,255,255,.06);transition:transform .15s,box-shadow .35s}.glass-cta.is-glass{background:transparent;border-color:transparent;box-shadow:none}.glass-cta.is-glass::after,.glass-cta.is-glass::before,.glass-cta .glass-layer::after{content:'';position:absolute;border-radius:inherit;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}.glass-cta.is-glass::after{inset:-2px;padding:1.5px;background:conic-gradient(from 0deg,rgba(255,255,255,.34),rgba(255,255,255,.16) 15%,rgba(255,255,255,.62) 25%,rgba(255,255,255,.16) 35%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.16) 65%,rgba(255,255,255,.62) 75%,rgba(255,255,255,.16) 85%,rgba(255,255,255,.34))}.glass-cta .glass-layer::after{inset:5px;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 50%,rgba(255,255,255,.07))}.glass-cta.is-glass::before{inset:-2px;padding:2.5px;opacity:0;transition:opacity .35s;filter:drop-shadow(0 0 3px rgba(170,215,255,.45));background:conic-gradient(from 0deg,rgba(255,255,255,.22),rgba(255,255,255,.12) 18%,#7fd8ff 22%,#fff 25%,#ffc27a 28%,rgba(255,255,255,.14) 32%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.14) 68%,#b9a2ff 72%,#fff 75%,#6fd3ff 78%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.22))}.glass-cta.is-glass:active::before,.glass-cta.is-glass.lit::before{opacity:1;transition-duration:.12s}.glass-cta:active,.glass-cta.lit{box-shadow:0 0 26px rgba(120,170,255,.22)}.glass-cta:focus-visible{outline:2px solid #fff;outline-offset:4px}.glass-layer{position:absolute;inset:-2px;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none}.glass-label,.glass-arrow{position:relative;text-shadow:0 1px 8px rgba(0,0,0,.6)}.glass-arrow{font-size:22px}#sax .image-button img{max-height:min(56svh,560px)}#sax .caption{margin:6px 0 22px}@media(prefers-reduced-motion:reduce){.key3d-wrap.ripple::before,.key3d-wrap.ripple::after{animation:none}.scene,.card{transition:none}}
</style></head><body><div id="app">
<header class="top"><div class="tiny">NAME BRAND RECORDS</div><div class="brand">GROOVE MAKERS</div></header>
<section class="scene active" id="key"><div class="key3d-wrap"><model-viewer id="press" class="key3d" role="button" tabindex="0" aria-label="Press the saxophone key" src="deck/sax_key_web.glb" alt="Saxophone key touch with abalone pearl" auto-rotate auto-rotate-delay="0" rotation-per-second="18deg" interaction-prompt="none" disable-zoom exposure="0.9" tone-mapping="neutral" camera-orbit="35deg 60deg auto"></model-viewer></div><p class="tiny key-hint">TAP THE KEY</p></section>
<section class="scene" id="sax"><button class="image-button" onclick="go(2)"><img src="preview-assets/sax.webp" alt="Gold saxophone with glass ribbons" onerror="this.style.display='none'"></button><p class="caption">Find your frequency.</p><button class="glass-cta" onclick="go(2)"><span class="glass-layer" aria-hidden="true"></span><span class="glass-label">Explore the collection</span><span class="glass-arrow" aria-hidden="true">→</span></button></section>
<section class="scene" id="gallery"><p class="tiny">THE COLLECTION</p><p class="caption">Past grooves. New possibilities.</p><div class="cards"><button class="card" onclick="go(3)" aria-label="Select record"><img src="assets/sleeve-front-v4.webp" alt="Groove Makers album sleeve"></button><button class="card" onclick="go(3)" aria-label="Select African Rhythms"><img src="assets/african-rhythms-sleeve-v2.webp" alt="African Rhythms album sleeve"></button><button class="card" onclick="go(3)" aria-label="Select African Rhythms"><img src="assets/african-rhythms-sleeve-v2.webp" alt="African Rhythms"></button></div><button class="cta" onclick="go(3)">Explore the record →</button></section>
<section class="scene" id="extract"><p class="tiny">AFRICAN RHYTHMS</p><div class="recordbox" id="recordbox"><img class="record" src="assets/vinyl-v2.webp" alt=""><img class="sleeve" src="assets/african-rhythms-sleeve-v2.webp" alt="African Rhythms sleeve"></div><div class="controls"><span class="tiny">PULL</span><input id="pull" type="range" min="0" max="100" value="0" aria-label="Pull vinyl out"><span id="amount" class="tiny">0%</span></div><button class="cta" onclick="go(4)" style="margin-top:20px">Take it to the deck →</button></section>
<section class="scene" id="turntable"><p class="tiny">AFRICAN RHYTHMS · 12 TRACKS</p><model-viewer id="deck" class="deck3d" data-rig src="deck/dj_rig_web.glb" alt="Groove Makers GM-001 turntable" camera-controls disable-zoom disable-pan interaction-prompt="none" camera-orbit="0deg 55deg auto" field-of-view="30deg" min-field-of-view="30deg" max-field-of-view="30deg" min-camera-orbit="-60deg 30deg 0.5m" max-camera-orbit="60deg 75deg 3m" shadow-intensity="0.8" tone-mapping="neutral"><button class="hs" slot="hotspot-start" data-position="-0.1717 0.075 0.1429" data-normal="0 1 0" data-label="Start" aria-label="Start the record" aria-pressed="false"></button><button class="hs" slot="hotspot-pitch" data-position="0.1732 0.075 0.1219" data-normal="0 1 0" data-label="Pitch 0%" aria-label="Pitch 0%. Click to change"></button></model-viewer><button class="cta" id="play" onclick="toggleDeck()">Spin the record ▶</button><label style="margin:16px">Choose track <select id="track" style="padding:9px;border-radius:8px;background:#222;color:#fff"></select></label><button class="cta" onclick="go(5)">Choose this track →</button></section>
<section class="scene" id="join"><div class="caption">Join Groove Makers.</div><p id="choice" class="tiny"></p><form class="form" id="joinForm"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email address" required><input name="artist" placeholder="DJ / artist name (optional)"><button type="submit">Join Groove Makers →</button><p class="note" id="status">Preview only. No information will be submitted.</p></form></section>
<nav class="bottom"><button onclick="go(Math.max(0,idx-1))">← Back</button><button onclick="go(Math.min(5,idx+1))">Next →</button></nav></div>
<script>
let idx=0,playing=false,pull=0;const pages=[...document.querySelectorAll('.scene')],box=document.getElementById('recordbox'),range=document.getElementById('pull');const titles=['African Rhythms','Kazi','Funky Wood','Tarishi','Mashariki','Chants','Don’t Give Up','Incognito','Poo Too','Liberation Dues','African Rhythms (45 Version Parts 1 & 2)','Afrobeat'];document.getElementById('track').innerHTML=titles.map((v,i)=>'<option value="'+i+'">'+String(i+1).padStart(2,'0')+' · '+v+'</option>').join('');
function go(n){idx=Math.min(5,Math.max(0,n));pages.forEach((p,i)=>p.classList.toggle('active',idx===i));if(idx===5)document.getElementById('choice').textContent=titles[document.getElementById('track').value]+' · African Rhythms';}
let rippling=false;const keyMv=document.getElementById('press'),keyWrap=keyMv.parentElement;if(matchMedia('(prefers-reduced-motion: reduce)').matches)keyMv.removeAttribute('auto-rotate');function pressKey(){if(rippling)return;rippling=true;keyMv.classList.add('pressed');keyWrap.classList.remove('ripple');void keyWrap.offsetWidth;keyWrap.classList.add('ripple');keyMv.exposure=1.7;setTimeout(()=>{keyMv.classList.remove('pressed');keyMv.exposure=0.9},220);setTimeout(()=>{rippling=false;go(1)},900)}keyMv.addEventListener('click',pressKey);keyMv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pressKey()}});keyMv.addEventListener('error',()=>{keyWrap.style.display='none';document.querySelector('.key-hint').textContent='Tap to reveal the saxophone';document.querySelector('.key-hint').onclick=()=>go(1)});
function setPull(v){pull=Math.max(0,Math.min(100,v));range.value=pull;document.getElementById('amount').textContent=Math.round(pull)+'%';box.style.setProperty('--pull',pull/100)}range.addEventListener('input',e=>setPull(+e.target.value));let dragging=false,startX=0,startPull=0;box.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startPull=pull;box.setPointerCapture(e.pointerId)});box.addEventListener('pointermove',e=>{if(dragging)setPull(startPull+(e.clientX-startX)/box.clientWidth*100)});box.addEventListener('pointerup',()=>dragging=false);
function toggleDeck(){const d=document.getElementById('deck');if(d.rig)d.rig.toggle()}function frameDeck(){const d=document.getElementById('deck'),a=d.clientWidth/d.clientHeight||1,o=d.getCameraOrbit();d.cameraOrbit=o.theta+'rad '+o.phi+'rad '+Math.min(2.6,Math.max(1,1.5/a)).toFixed(3)+'m';d.jumpCameraToGoal()}document.getElementById('deck').addEventListener('load',frameDeck);addEventListener('resize',frameDeck);document.getElementById('deck').addEventListener('rigchange',e=>{playing=e.detail.spinning;document.getElementById('play').textContent=playing?'Stop spinning ■':'Spin the record ▶'});document.getElementById('joinForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('status').textContent='Preview complete. Registration is not connected to a server.'});
</script>
<script src="deck/rig-controls.js"></script><script src="deck/fader.js"></script>
<script type="module" src="glass-cta.js"></script></body></html>
