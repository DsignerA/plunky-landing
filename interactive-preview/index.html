<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Groove Makers | Interactive Preview</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}#app{height:100svh;min-height:480px;background:black;position:relative;overflow:hidden}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .65s ease;pointer-events:none;padding:20px}.scene.active{opacity:1;visibility:visible;pointer-events:auto}.cover{object-fit:contain;max-width:100%;max-height:66vh;user-select:none;-webkit-user-drag:none}.image-button{color:#fff;border:0;background:transparent;padding:0;max-width:100%;display:flex;align-items:center;justify-content:center}.image-button img{max-height:76svh;max-width:min(95vw,620px);object-fit:contain}.key-art{filter:url(#liquidRipple);transform:none!important}.image-button:active .key-art{filter:url(#liquidRipple) brightness(1.2)}.caption{text-align:center;font-size:clamp(21px,4vw,36px);font-weight:300;margin:12px 0 22px}.cta{padding:14px 28px;border:1px solid #ddd;border-radius:50px;background:#121212;color:#fff}.tiny{font-size:11px;letter-spacing:.18em;color:#bbb}.top{position:absolute;top:3%;left:0;right:0;text-align:center;z-index:4;pointer-events:none}.brand{font-size:clamp(25px,5vw,52px);font-stretch:condensed;font-weight:900;letter-spacing:.04em}.bottom{position:absolute;bottom:2%;display:flex;gap:15px;justify-content:center;left:0;right:0;z-index:5}.bottom button{border:none;color:#aaa;background:none;font-size:12px}.bottom button:focus-visible{outline:2px solid #fff}.cards{display:flex;align-items:center;justify-content:center;isolation:isolate;height:min(52vh,420px);width:100%;max-width:650px;position:relative}.card{position:absolute;width:min(48vw,245px);aspect-ratio:1;transition:transform .6s;filter:drop-shadow(0 8px 13px #000);border:0;background:none;padding:0}.card img{width:100%;height:100%;object-fit:contain}.card:nth-child(1){transform:translate(-35%,-10%) rotate(-13deg)}.card:nth-child(2){transform:translate(35%,-9%) rotate(13deg)}.card:nth-child(3){transform:translate(0,17%) scale(1.05);z-index:2}.card:hover{z-index:3;transform:translate(0,-5%) scale(1.12)}.recordbox{position:relative;width:min(84vw,420px);aspect-ratio:1;touch-action:pan-y;user-select:none}.record,.sleeve{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;will-change:transform}.record{width:84%;height:84%;top:8%;left:7%;transform:translateX(calc(var(--pull, 0) * 54%));transition:transform .05s linear;z-index:1}.sleeve{z-index:2;transform:translateX(calc(var(--pull, 0) * -54%));transition:transform .05s linear}.controls{display:flex;gap:12px;align-items:center;justify-content:center;width:min(85vw,450px);margin-top:22px}.controls input{flex:1;accent-color:#eac08e}.deck{position:relative;width:min(88vw,480px);aspect-ratio:1}.deck img{position:absolute;object-fit:contain}.deck-base{inset:0;width:100%;height:100%}.deck-vinyl{left:15%;top:17%;width:69%;height:69%;animation:spin 4s linear infinite;animation-play-state:paused}.deck.arm{pointer-events:none}.deck-arm{left:0;top:0;width:100%;height:100%;pointer-events:none}.deck.play .deck-vinyl{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}.form{display:grid;gap:13px;width:min(90vw,470px);padding:28px;border-radius:20px;border:1px solid #777;background:linear-gradient(130deg,#1d1d1d,#030303)}.form input{width:100%;border-radius:12px;background:#141414;color:white;border:1px solid #888;padding:14px}.form button{background:#f2efe7;color:#101010;border:0;border-radius:30px;padding:15px}.note{color:#888;font-size:12px}.hidden{display:none!important}.glass-cta{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;width:min(84vw,440px);height:64px;padding:0 34px;border:2px solid transparent;border-radius:999px;color:#fff;font-size:17px;letter-spacing:.01em;background:linear-gradient(#08090c,#08090c) padding-box,conic-gradient(from 210deg,#fff,#7ad7ff,#c9a0ff,#ffcf8a,#fff,#9fe3ff,#fff) border-box;box-shadow:inset 0 0 14px rgba(255,255,255,.16),0 0 22px rgba(130,170,255,.22);transition:transform .15s}.glass-cta.is-glass{background:transparent;border-color:transparent;box-shadow:0 0 26px rgba(120,170,255,.18)}.glass-cta.is-glass::after,.glass-cta.is-glass::before{content:'';position:absolute;border-radius:inherit;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}.glass-cta.is-glass::after{inset:-2px;padding:2.5px;filter:drop-shadow(0 0 3px rgba(170,215,255,.45));background:conic-gradient(from 0deg,rgba(255,255,255,.22),rgba(255,255,255,.12) 18%,#7fd8ff 22%,#fff 25%,#ffc27a 28%,rgba(255,255,255,.14) 32%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.14) 68%,#b9a2ff 72%,#fff 75%,#6fd3ff 78%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.22))}.glass-cta.is-glass::before{inset:5px;padding:1px;background:conic-gradient(from 0deg,rgba(255,255,255,.05),rgba(255,255,255,.04) 20%,rgba(160,220,255,.55) 25%,rgba(255,255,255,.04) 30%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 70%,rgba(255,200,150,.5) 75%,rgba(255,255,255,.04) 80%)}.glass-cta:focus-visible{outline:2px solid #fff;outline-offset:4px}.glass-layer{position:absolute;inset:-2px;border-radius:inherit;overflow:hidden;z-index:-1;pointer-events:none}.glass-label,.glass-arrow{position:relative;text-shadow:0 1px 8px rgba(0,0,0,.6)}.glass-arrow{font-size:22px}#sax .image-button img{max-height:min(56svh,560px)}#sax .caption{margin:6px 0 22px}@media(prefers-reduced-motion:reduce){.scene,.card{transition:none}.deck-vinyl{animation:none}}
</style></head><body><div id="app">
<svg width="0" height="0" style="position:absolute"><filter id="liquidRipple" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="noise" type="fractalNoise" baseFrequency=".012 .020" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" id="displace"/></filter></svg>
<header class="top"><div class="tiny">NAME BRAND RECORDS</div><div class="brand">GROOVE MAKERS</div></header>
<section class="scene active" id="key"><button class="image-button" id="press" aria-label="Press saxophone key"><img class="key-art" src="preview-assets/key.webp" alt="Iridescent saxophone key" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><span class="hidden caption">Tap to reveal the saxophone</span></button></section>
<section class="scene" id="sax"><button class="image-button" onclick="go(2)"><img src="preview-assets/sax.webp" alt="Gold saxophone with glass ribbons" onerror="this.style.display='none'"></button><p class="caption">Find your frequency.</p><button class="glass-cta" onclick="go(2)"><span class="glass-layer" aria-hidden="true"></span><span class="glass-label">Explore the collection</span><span class="glass-arrow" aria-hidden="true">→</span></button></section>
<section class="scene" id="gallery"><p class="tiny">THE COLLECTION</p><p class="caption">Past grooves. New possibilities.</p><div class="cards"><button class="card" onclick="go(3)" aria-label="Select record"><img src="assets/sleeve-front-v4.webp" alt="Groove Makers album sleeve"></button><button class="card" onclick="go(3)" aria-label="Select African Rhythms"><img src="assets/african-rhythms-sleeve-v2.webp" alt="African Rhythms album sleeve"></button><button class="card" onclick="go(3)" aria-label="Select African Rhythms"><img src="assets/african-rhythms-sleeve-v2.webp" alt="African Rhythms"></button></div><button class="cta" onclick="go(3)">Explore the record →</button></section>
<section class="scene" id="extract"><p class="tiny">AFRICAN RHYTHMS</p><div class="recordbox" id="recordbox"><img class="record" src="assets/vinyl-v2.webp" alt=""><img class="sleeve" src="assets/african-rhythms-sleeve-v2.webp" alt="African Rhythms sleeve"></div><div class="controls"><span class="tiny">PULL</span><input id="pull" type="range" min="0" max="100" value="0" aria-label="Pull vinyl out"><span id="amount" class="tiny">0%</span></div><button class="cta" onclick="go(4)" style="margin-top:20px">Take it to the deck →</button></section>
<section class="scene" id="turntable"><p class="tiny">AFRICAN RHYTHMS · 12 TRACKS</p><div class="deck" id="deck"><img class="deck-base" src="assets/acrylic/deck.webp" alt="Premium acrylic turntable"><img class="deck-vinyl" src="assets/vinyl-v2.webp" alt="Selected record"><img class="deck-arm" src="assets/acrylic/tonearm.webp" alt=""></div><button class="cta" id="play" onclick="toggleDeck()">Spin the record ▶</button><label style="margin:16px">Choose track <select id="track" style="padding:9px;border-radius:8px;background:#222;color:#fff"></select></label><button class="cta" onclick="go(5)">Choose this track →</button></section>
<section class="scene" id="join"><div class="caption">Join Groove Makers.</div><p id="choice" class="tiny"></p><form class="form" id="joinForm"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email address" required><input name="artist" placeholder="DJ / artist name (optional)"><button type="submit">Join Groove Makers →</button><p class="note" id="status">Preview only. No information will be submitted.</p></form></section>
<nav class="bottom"><button onclick="go(Math.max(0,idx-1))">← Back</button><button onclick="go(Math.min(5,idx+1))">Next →</button></nav></div>
<script>
let idx=0,playing=false,pull=0;const pages=[...document.querySelectorAll('.scene')],box=document.getElementById('recordbox'),range=document.getElementById('pull');const titles=['African Rhythms','Kazi','Funky Wood','Tarishi','Mashariki','Chants','Don’t Give Up','Incognito','Poo Too','Liberation Dues','African Rhythms (45 Version Parts 1 & 2)','Afrobeat'];document.getElementById('track').innerHTML=titles.map((v,i)=>'<option value="'+i+'">'+String(i+1).padStart(2,'0')+' · '+v+'</option>').join('');
function go(n){idx=Math.min(5,Math.max(0,n));pages.forEach((p,i)=>p.classList.toggle('active',idx===i));if(idx===5)document.getElementById('choice').textContent=titles[document.getElementById('track').value]+' · African Rhythms';}
let wave=0,rippling=false;document.getElementById('press').addEventListener('click',()=>{if(rippling)return;rippling=true;let start=performance.now();const displacement=document.getElementById('displace');function tick(t){let x=(t-start)/900;let strength=24*Math.sin(Math.min(1,x)*Math.PI)*Math.sin(x*24);displacement.setAttribute('scale',String(Math.abs(strength)));if(x<1)requestAnimationFrame(tick);else{displacement.setAttribute('scale','0');rippling=false;go(1)}}requestAnimationFrame(tick)});
function setPull(v){pull=Math.max(0,Math.min(100,v));range.value=pull;document.getElementById('amount').textContent=Math.round(pull)+'%';box.style.setProperty('--pull',pull/100)}range.addEventListener('input',e=>setPull(+e.target.value));let dragging=false,startX=0,startPull=0;box.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startPull=pull;box.setPointerCapture(e.pointerId)});box.addEventListener('pointermove',e=>{if(dragging)setPull(startPull+(e.clientX-startX)/box.clientWidth*100)});box.addEventListener('pointerup',()=>dragging=false);
function toggleDeck(){playing=!playing;document.getElementById('deck').classList.toggle('play',playing);document.getElementById('play').textContent=playing?'Stop spinning ■':'Spin the record ▶'}document.getElementById('joinForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('status').textContent='Preview complete. Registration is not connected to a server.'});
</script>
<script type="module" src="glass-cta.js"></script></body></html>
