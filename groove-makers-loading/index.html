<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040d23"><title>Groove Makers — Loading Screen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet"><link rel="stylesheet" href="loader.css">
<style>body{margin:0;background:#040d23;color:#f5f8ff;font-family:system-ui}body>main{padding:8vw}body>main a{color:#a3f2ff}</style></head><body>
<main><h1>Groove Makers loading component</h1><p>The loader dismisses when this page is ready.</p><p><a href="demo.html">Open the replayable design demo</a></p><p>Integrate this component with your existing homepage using INTEGRATION.md.</p></main>
<div id="gc-merged-loader" class="gm-overlay" aria-label="Loading Groove Makers" aria-busy="true">

<div class="gm-surface"><div class="gc-screen" aria-label="Groove Makers loading and entrance preview">
<div class="gc-lights" aria-hidden="true"></div><div class="gc-glass" aria-hidden="true"></div><div class="gc-floor" aria-hidden="true"></div><div class="gc-corner gc-corner-left" aria-hidden="true"></div><div class="gc-corner gc-corner-right" aria-hidden="true"></div>
<div class="gc-loading">
<p class="gc-presenter">NAME BRAND RECORDS PRESENTS</p>
<div class="gc-turntable"><div class="gc-table-unit">
<img class="gc-deck" src="assets/deck.webp" alt="Dark brushed-metal turntable">
<div class="gc-disc-seat"><img class="gc-record" src="assets/vinyl.webp" alt="Groove Makers vinyl"></div>
<div class="gc-power-ring" aria-hidden="true"></div>
<img class="gc-knob" src="assets/knob.webp" alt="Silver start control">
<img class="gc-fader-cap" src="assets/fader.webp" alt="Silver pitch fader">
<div class="gc-led" aria-hidden="true"></div>
<img class="gc-mounted-arm" src="assets/tonearm.webp" alt="Silver tonearm mounted to the deck">
</div></div>
<img class="gc-title" src="assets/title.webp" alt="Groove Makers by Plunky">
<div class="gc-wave" aria-hidden="true"><canvas class="gc-ether-wave"></canvas></div>
<div class="gc-tagline">Finding the groove.</div>
</div>

</div></div>
<span class="gm-sr" role="status">Loading Groove Makers</span>
</div>
<script src="loader.js" defer></script>
</body></html>
