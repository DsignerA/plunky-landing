<style>
#gc-merged-loader .gc-screen{position:relative;isolation:isolate;overflow:hidden;min-height:630px;background:#030b20;color:#f5f8ff;font-family:'DM Sans',sans-serif;container-type:inline-size}
#gc-merged-loader .gc-lights{position:absolute;inset:-12%;background:radial-gradient(ellipse at 77% 33%,#12bce3aa,transparent 34%),radial-gradient(ellipse at 12% 25%,#6945e888,transparent 29%),radial-gradient(ellipse at 84% 88%,#5938ff66,transparent 32%);filter:blur(22px);animation:gc-drift 12s ease-in-out infinite alternate}
#gc-merged-loader .gc-glass{position:absolute;inset:0 0 21%;background:#accaff0b;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid #97dfff50;box-shadow:inset 0 -1px 0 #fff2;transition:backdrop-filter 1000ms ease,background 1000ms ease}
#gc-merged-loader .gc-glass:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 28%,#c9e8ff09 47%,transparent 59%)}
#gc-merged-loader .gc-floor{position:absolute;inset:79% 0 0;background:radial-gradient(ellipse at 70% 0,#3776d977,transparent 55%),radial-gradient(ellipse at 28% 0,#6440e855,transparent 45%),linear-gradient(#061429,#030b20);box-shadow:0 -2px 18px #3389ff24}

#gc-merged-loader .gc-record-stage{position:relative;width:min(58%,270px);aspect-ratio:1;flex-shrink:0}
#gc-merged-loader .gc-record{position:relative;width:100%;height:auto;z-index:1;display:block;filter:drop-shadow(0 18px 17px #0009)}
#gc-merged-loader .gc-orbit{position:absolute;inset:-9%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 110deg,#735bff40 145deg,#a38aff 225deg,#56eaff 290deg,transparent 300deg);mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:gc-orbit 5s linear infinite;filter:drop-shadow(0 0 5px #40d9ff)}
#gc-merged-loader .gc-title{width:min(57%,218px);height:auto;position:relative;z-index:2;display:block;margin-top:-16px}

#gc-merged-loader .gc-status{font-size:11px;letter-spacing:.15em;color:#b1c1e3;margin-bottom:14px}
#gc-merged-loader .gc-line{width:130px;height:2px;background:#9aafff25;overflow:hidden}#gc-merged-loader .gc-line:after{content:'';display:block;width:42%;height:100%;background:linear-gradient(90deg,#9874ff,#8defff);animation:gc-cue 1.8s ease-in-out infinite}

#gc-merged-loader .gc-sleeve{position:absolute;bottom:5%;right:4%;width:47%;filter:drop-shadow(0 18px 20px #0008)}
#gc-merged-loader .gc-screen.gc-revealed .gc-loading{opacity:0;transform:translateY(-18px)}#gc-merged-loader .gc-screen.gc-revealed .gc-home{opacity:1;visibility:visible;transform:translateY(0)}#gc-merged-loader .gc-screen.gc-revealed .gc-glass{backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);background:#accaff02}#gc-merged-loader .gc-screen.gc-revealed .gc-orbit,#gc-merged-loader .gc-screen.gc-revealed .gc-line:after{animation-play-state:paused}

<style>
#gc-merged-loader .gc-wave{width:170px;height:24px;gap:0;position:relative;margin:0 auto}
#gc-merged-loader .gc-ether-wave{display:block;width:100%;height:24px;filter:drop-shadow(0 0 3px #65dcff33)}
</style>
<script>
(()=>{
 const root=document.getElementById('gc-merged-loader');
 const canvas=root.querySelector('.gc-ether-wave');
 const screen=root.querySelector('.gc-screen');
 if(!canvas)return;
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let width=170,height=24,frame=0,visible=true;
 function size(){const rect=canvas.getBoundingClientRect();width=rect.width||170;height=24;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw(0);}
 function draw(time){ctx.clearRect(0,0,width,height);const t=reduced.matches?0:time*.00055;
  for(let layer=0;layer<3;layer++){
   ctx.beginPath();
   for(let x=0;x<=width;x++){
    const u=x/width;const envelope=Math.pow(Math.sin(Math.PI*u),1.6);
    const breath=0.65+0.35*Math.sin(t*.7+layer*.8);
    const y=height/2+envelope*(Math.sin(u*Math.PI*(4.2+layer*.4)-t+layer*.65)*3.2*breath+Math.sin(u*Math.PI*9+t*.43)*.65);
    if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const gradient=ctx.createLinearGradient(0,0,width,0);
   gradient.addColorStop(0,'rgba(126,109,238,0)');gradient.addColorStop(.23,layer===0?'rgba(137,129,255,.65)':'rgba(134,105,244,.23)');gradient.addColorStop(.60,layer===0?'rgba(147,242,255,.9)':'rgba(124,220,255,.28)');gradient.addColorStop(1,'rgba(119,219,255,0)');
   ctx.strokeStyle=gradient;ctx.lineWidth=layer===0?.8:.5;ctx.stroke();
  }
 }
 function tick(time){frame=0;if(!visible||screen.classList.contains('gc-revealed')||reduced.matches){draw(0);return;}draw(time);frame=requestAnimationFrame(tick);}
 function resume(){if(frame)cancelAnimationFrame(frame);frame=0;if(visible&&!screen.classList.contains('gc-revealed')&&!reduced.matches)frame=requestAnimationFrame(tick);else draw(0);}
 new ResizeObserver(size).observe(canvas);
 new MutationObserver(resume).observe(screen,{attributes:true,attributeFilter:['class']});
 new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;resume();}).observe(canvas);
 reduced.addEventListener('change',resume);size();resume();
})();
</script>
